[project]
name = "ai-employee"
version = "0.3.0"
description = "AI Employee — Gold Tier: Gmail + LinkedIn + Facebook + Odoo + CEO Briefing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Bronze tier
    "watchdog>=6.0.0",

    # Silver tier — Gmail
    "google-auth>=2.27.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.118.0",

    # Silver tier — LinkedIn / Browser automation
    "playwright>=1.42.0",

    # Silver tier — Gmail MCP server
    "mcp>=1.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",

    # Gold tier — Facebook Graph API (uses requests, already listed above)
    # Gold tier — Odoo JSON-RPC (uses requests, already listed above)
    # Note: Docker required separately for Odoo (not a Python package)
]

[project.scripts]
ai-employee = "main:main"
gmail-auth = "gmail_auth:main"
orchestrator = "orchestrator:main"
facebook-watcher = "facebook_watcher:main"
ceo-briefing = "ceo_briefing:generate_briefing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]
